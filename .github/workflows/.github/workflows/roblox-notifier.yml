name: Roblox Notifier

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Durumu kontrol et ve bildirim gonder
        run: python main.py

      - name: Durumu repoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add durum.json
          git diff --staged --quiet || git commit -m "durum guncellendi"
          git push
